<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Master Test</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; background: #f9f9f9;}
        .card { background: white; border: 1px solid #ccc; padding: 25px; border-radius: 8px; box-shadow: 2px 2px 12px #eee; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; border: 1px solid #aaa; border-radius: 4px;}
        button { background-color: #3399cc; color: window; padding: 14px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold;}
        button:hover { background-color: #287a99; }
        .error { color: #d00; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">Final Razorpay Checkout</h2>
    <p>Please enter the specific info below to test. Everything must be exact.</p>
    
    <label>Order ID (e.g. order_SL6YWWvmWAf4vc)</label>
    <input type="text" id="order-id" placeholder="Copy exactly from backend">

    <label>Amount in Paise (e.g. 118000 for ₹1180.00)</label>
    <input type="number" id="amount" value="118000">

    <div id="error-msg" class="error"></div>
    <button id="rzp-button1">Simulate Netbanking Payment</button>
</div>

<!-- Essential Razorpay script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.getElementById('rzp-button1').onclick = function(e){
    e.preventDefault();
    var orderField = document.getElementById('order-id').value.trim();
    var amountField = parseInt(document.getElementById('amount').value.trim(), 10);
    var erroMsg = document.getElementById('error-msg');
    
    erroMsg.innerText = "";
    if(!orderField || !orderField.startsWith('order_')) {
        erroMsg.innerText = "❌ Order ID MUST start with 'order_'";
        return;
    }

    var options = {
        "key": "rzp_test_SL2t52a6r7GIcE",
        "amount": amountField, // MUST be integer!
        "currency": "INR",
        "name": "Dispose Backend Test",
        "description": "Testing Webhook Fire",
        "order_id": orderField,
        "handler": function (response){
            alert("✅ SUCCESS!\nPayment ID: " + response.razorpay_payment_id);
            console.log(response);
        },
        "prefill": {
            "name": "Test Runner",
            "email": "test@dispose.com",
            "contact": "9999999999",
            "method": "netbanking"
        },
        // Force Netbanking to bypass international card errors completely
        "config": {
            "display": {
                "blocks": {
                    "banks": {
                        "name": "Most Popular Banks",
                        "instruments": [
                            {"method": "netbanking"}
                        ]
                    }
                },
                "sequence": ["block.banks"]
            }
        },
        "theme": { "color": "#1e3a8a" }
    };
    
    try {
        var rzp1 = new Razorpay(options);
        rzp1.on('payment.failed', function (response){
            alert("❌ FAILED: " + response.error.description);
            console.error(response);
        });
        rzp1.open();
    } catch(err) {
        alert("CRITICAL ERROR booting Razorpay! See console.");
        console.error(err);
    }
}
</script>

</body>
</html>
